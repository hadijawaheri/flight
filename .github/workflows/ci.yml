name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: mongodb://127.0.0.1:27017/e2e
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0123456
      OTP_HMAC_SECRET: ci-otp-secret-ci-otp-secret-0123456789
      OTP_FIXED_CODE: "123456"
      THROTTLE_ENABLED: "false"
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @skeleton/web exec playwright install --with-deps chromium
      - run: pnpm --filter @skeleton/web test:e2e
