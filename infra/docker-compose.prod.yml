# Full stack in containers, as an alternative to PM2 on the host (see docs/server-hardening.md).
# Run from the repo root: docker compose -f infra/docker-compose.prod.yml --env-file infra/prod.env up -d --build
# Only Caddy publishes ports; MongoDB, the API and the web app are reachable inside this network only.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    # A replica set with auth needs a shared key file, even with one member
    entrypoint:
      - bash
      - -c
      - |
        [ -f /data/configdb/keyfile ] || openssl rand -base64 756 > /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile && chown 999:999 /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    volumes: [mongo-data:/data/db, mongo-config:/data/configdb]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      retries: 20

  mongo-init:
    image: mongo:8
    depends_on: { mongo: { condition: service_healthy } }
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_APP_USER: ${MONGO_APP_USER:-flysmart}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
    volumes: [./mongo-init.sh:/mongo-init.sh:ro]
    entrypoint: ["bash", "/mongo-init.sh"]
    restart: "no"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { mongo-init: { condition: service_completed_successfully } }
    env_file: [../apps/api/.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "7791"
      DATABASE_URL: mongodb://${MONGO_APP_USER:-flysmart}:${MONGO_APP_PASSWORD:?}@mongo:27017/flysmart?replicaSet=rs0&authSource=flysmart

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    depends_on: { mongo-init: { condition: service_completed_successfully } }
    env_file: [../apps/api/.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://${MONGO_APP_USER:-flysmart}:${MONGO_APP_PASSWORD:?}@mongo:27017/flysmart?replicaSet=rs0&authSource=flysmart
    command: ["node", "dist/migrate.js"]
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:7791
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost:8080}
      UPSTREAM: web:7792
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

volumes:
  mongo-data:
  mongo-config:
  caddy-data:
  caddy-config:
  caddy-logs:
